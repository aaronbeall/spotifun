<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030712">
  <title>Offline · Spotifun</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, #2e1065 0%, #030712 60%); color: #e5e7eb; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 72px; height: 72px; }
    h1 { margin: 16px 0 8px; font-size: 28px; color: #fff; }
    p { margin: 0 auto; max-width: 22rem; color: #9ca3af; }
    button { margin-top: 24px; border: 0; border-radius: 999px; padding: 12px 22px; font: inherit; font-weight: 600; color: #fff; background: linear-gradient(90deg, #8b5cf6, #d946ef); cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>The music stopped.</h1>
    <p>You're offline, and Spotifun needs Spotify to read your listening. Find some signal and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
